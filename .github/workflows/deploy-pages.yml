name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/0016254c-windows-web-edition
  workflow_dispatch:

# Права нужны для переключения источника Pages и деплоя артефакта.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check + production build
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Pages изначально был настроен на legacy-источник (ветка main).
      # Переводим его на сборку из GitHub Actions; повторные запуски ничего не меняют.
      - name: Ensure Pages source is GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' || echo unknown)
          echo "Current Pages build_type: $current"
          if [ "$current" != "workflow" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
