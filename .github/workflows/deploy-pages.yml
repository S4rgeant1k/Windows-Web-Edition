name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Права нужны для создания Pages-деплоя из артефакта.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check + production build
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      # Регрессионная проверка: все иконки/обои лежат в public/assets, поэтому
      # в собранном JS сразу после base должен идти префикс assets/. Без него
      # картинки отдавали бы 404 (base/icons/... вместо base/assets/icons/...).
      - name: Verify asset URLs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          test -f dist/assets/icons/start-menu.svg
          test -f dist/assets/wallpapers/win10-default.jpg
          if grep -RqF "${BASE_PATH}icons/" dist/assets/*.js; then
            echo "::error::Asset URLs are missing the assets/ prefix"
            exit 1
          fi
          if ! grep -RqF "${BASE_PATH}assets/" dist/assets/*.js; then
            echo "::error::Built bundle does not contain base + assets/ URLs"
            exit 1
          fi
          echo "Asset URLs are correct: ${BASE_PATH}assets/..."

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Pages в этом репозитории исторически настроен на legacy-источник (ветка main).
      # Токен интеграции не может сменить build_type (403), поэтому:
      #  1) пытаемся переключить источник на GitHub Actions (сработает у обычного PAT/админа);
      #  2) если не вышло — ждём завершения legacy Jekyll-сборки и публикуем артефакт
      #     ПОСЛЕ неё, иначе Jekyll перезапишет сайт исходниками.
      - name: Check Pages source
        id: pages_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' || echo unknown)
          echo "Current Pages build_type: $current"
          if [ "$current" = "workflow" ]; then
            echo "legacy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow; then
            echo "Pages source switched to GitHub Actions."
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Pages source::Токен не смог сменить источник; деплой будет выполнен после legacy-сборки."
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for legacy Pages build to settle
        if: steps.pages_source.outputs.legacy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="${{ github.sha }}"
          for i in $(seq 1 60); do
            info=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '[.status, .commit] | @tsv' 2>/dev/null || true)
            status=$(printf '%s' "$info" | cut -f1)
            commit=$(printf '%s' "$info" | cut -f2)
            echo "attempt $i: status=$status commit=$commit"
            if [ "$commit" = "$target" ] && [ "$status" = "built" ]; then
              echo "Legacy build finished. Waiting a few more seconds before publishing the artifact."
              sleep 20
              break
            fi
            sleep 5
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
